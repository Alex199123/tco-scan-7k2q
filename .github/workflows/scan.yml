name: Deal scan

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub sometimes runs it a few minutes late)
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: deal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python scanner.py

      - name: Save results
        run: |
          git config user.name "deal-scanner"
          git config user.email "deal-scanner@users.noreply.github.com"
          git add data/state.json docs/index.html
          git diff --cached --quiet || git commit -m "Scan $(date -u +%H:%M)"
          git pull --rebase --quiet || true
          git push
